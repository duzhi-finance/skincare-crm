<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>皮膚管理 CRM</title>
<style>
  :root{
    --bg:#f7f2ec;          /* 暖白 */
    --card:#ffffff;
    --milk:#c8a98b;        /* 奶茶色 */
    --milk-dark:#a9876a;
    --milk-soft:#efe4d8;
    --milk-pale:#f8f1ea;
    --text:#4a3f37;
    --sub:#9a8f87;
    --line:#ece6e0;
    --gray:#f2efec;
    --danger:#d98a7e;
    --ok:#8fae94;
    --radius:18px;
    --shadow:0 4px 18px rgba(120,90,60,.08);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;
    padding-bottom:calc(84px + var(--safe-b));
  }
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:.02em}

  /* ===== Header ===== */
  header{
    position:sticky;top:0;z-index:20;background:rgba(247,242,236,.92);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    padding:14px 18px 10px;border-bottom:1px solid var(--line);
  }
  header .brand{font-size:12px;color:var(--sub);letter-spacing:.15em}
  header h1{font-size:20px}

  main{max-width:820px;margin:0 auto;padding:16px}
  .page{display:none;animation:fade .2s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ===== Common ===== */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .section-title{font-size:13px;color:var(--sub);margin:18px 4px 8px;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .muted{color:var(--sub);font-size:13px}
  .empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px}

  .btn{
    border:none;border-radius:14px;padding:12px 16px;cursor:pointer;
    background:var(--milk);color:#fff;font-weight:500;transition:.15s;white-space:nowrap;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--milk-soft);color:var(--milk-dark)}
  .btn.light{background:var(--gray);color:var(--text)}
  .btn.danger{background:#f6e3df;color:#c06a5d}
  .btn.block{width:100%;padding:15px;font-size:16px}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
  .btn:disabled{opacity:.45;pointer-events:none}

  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{
    width:100%;border:1px solid var(--line);background:#fbf9f7;border-radius:12px;
    padding:12px 14px;outline:none;transition:.15s;font-size:16px; /* 16px 防 iOS 放大 */
  }
  input:focus,select:focus,textarea:focus{border-color:var(--milk);background:#fff;box-shadow:0 0 0 3px rgba(200,169,139,.18)}
  textarea{min-height:90px;resize:vertical}
  label.field{display:block;margin-bottom:12px}
  label.field>span{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .search{position:relative}
  .search input{padding-left:40px;border-radius:16px;background:#fff;box-shadow:var(--shadow);border-color:transparent}
  .search::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-52%);color:var(--sub);font-size:20px}

  /* Tags */
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--milk-pale);color:var(--milk-dark);border:1px solid var(--milk-soft)}
  .chip-select{display:flex;flex-wrap:wrap;gap:8px}
  .chip-select label{cursor:pointer}
  .chip-select input{display:none}
  .chip-select span{display:inline-block;padding:8px 14px;border-radius:20px;background:var(--gray);font-size:14px;transition:.15s;border:1px solid transparent}
  .chip-select input:checked+span{background:var(--milk-soft);color:var(--milk-dark);border-color:var(--milk)}

  /* Customer list */
  .cust{display:flex;align-items:center;gap:12px;cursor:pointer}
  .avatar{
    width:46px;height:46px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,#efe1d2,#d9bfa6);color:#fff;font-weight:600;font-size:18px;
  }
  .cust .name{font-weight:600;font-size:16px}
  .cust .meta{text-align:right;font-size:12px;color:var(--sub);flex-shrink:0}
  .cust .meta b{color:var(--text);font-size:14px}

  /* Stats */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .stat{background:var(--milk-pale);border-radius:14px;padding:12px 14px}
  .stat .k{font-size:12px;color:var(--sub)}
  .stat .v{font-size:22px;font-weight:600;color:var(--milk-dark)}
  .stat .v small{font-size:13px;font-weight:400;margin-left:2px}

  /* Timeline */
  .tl{border-left:2px solid var(--milk-soft);margin-left:6px;padding-left:16px}
  .tl-item{position:relative;padding:4px 0 14px}
  .tl-item::before{content:"";position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--milk)}
  .tl-item .d{font-size:12px;color:var(--sub)}
  .tl-item .t{white-space:pre-wrap;word-break:break-word}
  .tl-item .x{float:right;background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px}

  /* Checkout items */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .item{
    background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;
    position:relative;transition:.15s;user-select:none;
  }
  .item.on{border-color:var(--milk);background:var(--milk-pale)}
  .item .n{font-weight:500;font-size:14px}
  .item .p{color:var(--milk-dark);font-weight:600;margin-top:2px}
  .item .qty{display:none;align-items:center;gap:8px;margin-top:8px}
  .item.on .qty{display:flex}
  .qty button{width:30px;height:30px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);cursor:pointer;font-size:16px;color:var(--milk-dark)}
  .qty b{min-width:18px;text-align:center}

  .pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pay label input{display:none}
  .pay label span{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    min-height:62px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:13px;cursor:pointer;padding:6px;transition:.15s
  }
  .pay label span i{font-style:normal;font-size:20px;line-height:1.2}
  .pay label input:checked+span{border-color:var(--milk);background:var(--milk-pale);color:var(--milk-dark);font-weight:500}
  .pay label input:disabled+span{opacity:.4}

  .summary .line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .summary .total{font-size:20px;font-weight:600;color:var(--milk-dark);border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
  .warn{background:#fbecea;color:#b4655a;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
  .info{background:var(--milk-pale);color:var(--milk-dark);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}

  .picker{position:relative}
  .picker-list{
    position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(120,90,60,.16);
    max-height:260px;overflow:auto;z-index:15;display:none
  }
  .picker-list.show{display:block}
  .picker-list div{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .picker-list div:last-child{border:none}
  .picker-list div:active{background:var(--milk-pale)}

  /* Orders */
  .order{cursor:pointer}
  .order .amt{font-weight:600;color:var(--milk-dark)}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--gray);color:var(--sub);margin-left:6px;vertical-align:middle}

  /* Bottom nav */
  nav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));
  }
  nav button{
    flex:1;border:none;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:12px;color:var(--sub);cursor:pointer;border-radius:12px
  }
  nav button i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.6}
  nav button.active{color:var(--milk-dark);font-weight:600;background:var(--milk-pale)}
  nav button.active i{filter:none;opacity:1}

  .fab{
    position:fixed;right:18px;bottom:calc(86px + var(--safe-b));z-index:25;width:56px;height:56px;border-radius:50%;
    border:none;background:var(--milk);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(169,135,106,.4);cursor:pointer
  }

  /* Modal */
  .modal{
    position:fixed;inset:0;z-index:50;background:rgba(74,63,55,.35);display:none;
    align-items:flex-end;justify-content:center;
  }
  .modal.show{display:flex;animation:fade .2s}
  .sheet{
    background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;
    border-radius:24px 24px 0 0;padding:8px 18px calc(22px + var(--safe-b));
    animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
  .sheet .grab{width:42px;height:5px;border-radius:5px;background:#ddd3c9;margin:4px auto 12px}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet-head h2{font-size:19px}
  .close{border:none;background:var(--gray);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--sub)}
  @media(min-width:700px){
    .modal{align-items:center}
    .sheet{border-radius:24px;max-height:88vh}
  }

  .receipt{
    background:#fff;border-radius:16px;padding:18px;white-space:pre-wrap;word-break:break-word;
    font-family:"Noto Sans TC",system-ui,sans-serif;font-size:14.5px;line-height:1.75;
    box-shadow:var(--shadow);margin:0 0 14px;border:1px dashed var(--milk-soft)
  }
  .btn.copied{background:var(--ok)}

  .toast{
    position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:var(--text);color:#fff;
    padding:10px 18px;border-radius:30px;font-size:14px;z-index:100;white-space:nowrap;max-width:90vw;opacity:0;transition:.25s;pointer-events:none
  }
  .toast.show{opacity:.95;transform:translate(-50%,0)}

  .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border:none}
  .seg{display:flex;background:var(--gray);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:none;background:none;padding:8px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--sub)}
  .seg button.active{background:#fff;color:var(--milk-dark);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.05)}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:12px;cursor:pointer}
  .check input{width:18px;height:18px;accent-color:var(--milk)}
</style>
</head>
<body>

<header>
  <div class="brand">SKIN CARE CRM</div>
  <h1 id="shopTitle">皮膚管理</h1>
</header>

<main>
  <!-- ========== 顧客 ========== -->
  <section class="page active" id="page-customers">
    <div class="search"><input type="search" id="custSearch" placeholder="搜尋姓名或電話…" autocomplete="off"></div>
    <div class="section-title"><span id="custCount">顧客 0 位</span></div>
    <div id="custList"></div>
  </section>

  <!-- ========== 結帳 ========== -->
  <section class="page" id="page-checkout">
    <div class="card">
      <div class="section-title" style="margin-top:0">① 選擇顧客</div>
      <div class="picker">
        <input type="search" id="coSearch" placeholder="輸入姓名或電話搜尋顧客…" autocomplete="off">
        <div class="picker-list" id="coPickerList"></div>
      </div>
      <div id="coCustomer"></div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">② 服務項目</div>
      <div class="items" id="coServices"></div>
      <div class="section-title">居家保養品</div>
      <div class="items" id="coProducts"></div>
    </div>

    <div class="card">
      <div class="section-title" style="margin-top:0">③ 付款 / 核銷方式</div>
      <div class="pay" id="coPay"></div>
      <div id="coSubPay"></div>
      <div id="coMsg"></div>
    </div>

    <div class="card summary" id="coSummary"></div>
    <button class="btn block" id="coConfirm" onclick="confirmCheckout()">確認結帳</button>
    <div style="height:10px"></div>
  </section>

  <!-- ========== 消費紀錄 ========== -->
  <section class="page" id="page-orders">
    <div class="card">
      <div class="row">
        <div class="grow"><div class="muted">今日營收（實收）</div><div style="font-size:24px;font-weight:600;color:var(--milk-dark)" id="todayRevenue">$0</div></div>
        <div style="text-align:right"><div class="muted">今日筆數</div><div style="font-size:24px;font-weight:600" id="todayCount">0</div></div>
      </div>
    </div>
    <div class="section-title">消費紀錄（點擊可重開收據）</div>
    <div id="orderList"></div>
  </section>

  <!-- ========== 設定 ========== -->
  <section class="page" id="page-settings">
    <div class="section-title">店家資訊</div>
    <div class="card">
      <label class="field"><span>店家名稱（顯示於收據）</span><input type="text" id="setShopName"></label>
      <label class="field" style="margin:0"><span>收據結尾語</span><input type="text" id="setFooter"></label>
      <button class="btn sm ghost" style="margin-top:12px" onclick="saveShop()">儲存店家資訊</button>
    </div>

    <div class="section-title">品項管理</div>
    <div class="card">
      <div class="seg" id="itemSeg">
        <button class="active" data-cat="service">服務項目</button>
        <button data-cat="product">居家保養品</button>
      </div>
      <div id="itemList"></div>
      <div class="row" style="margin-top:12px">
        <input type="text" id="newItemName" placeholder="品項名稱" class="grow">
        <input type="number" id="newItemPrice" placeholder="價格" style="width:100px" inputmode="numeric">
        <button class="btn sm" onclick="addItem()">新增</button>
      </div>
    </div>

    <div class="section-title">資料備份</div>
    <div class="card">
      <p class="muted" style="margin-top:0">所有資料都存在此瀏覽器中。建議每日營業結束後匯出備份，換手機或清除瀏覽器資料前務必備份。</p>
      <div class="grid2">
        <button class="btn" onclick="exportJSON()">⬇︎ 匯出 JSON 備份</button>
        <button class="btn ghost" onclick="document.getElementById('importFile').click()">⬆︎ 匯入 JSON 復原</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <div class="muted" id="lastBackup" style="margin-top:10px"></div>
    </div>

    <div class="section-title">危險區域</div>
    <div class="card">
      <button class="btn danger block" onclick="resetAll()">清除所有資料</button>
    </div>
  </section>
</main>

<button class="fab" id="fab" onclick="openCustomerForm()" aria-label="新增顧客">＋</button>

<nav>
  <button class="active" data-page="customers"><i>👥</i>顧客</button>
  <button data-page="checkout"><i>🧾</i>結帳</button>
  <button data-page="orders"><i>📋</i>紀錄</button>
  <button data-page="settings"><i>⚙️</i>設定</button>
</nav>

<!-- 通用彈窗 -->
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<!-- 收據彈窗 -->
<div class="modal" id="receiptModal">
  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-head"><h2>✅ 結帳完成</h2><button class="close" onclick="closeReceipt()">✕</button></div>
    <pre class="receipt" id="receiptText"></pre>
    <button class="btn block" id="copyBtn" onclick="copyReceipt()">📋 一鍵複製收據文字</button>
    <p class="muted" style="text-align:center;margin:10px 0 0">複製後貼到顧客的 LINE 聊天室即可</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 資料層 ================= */
const STORE_KEY = 'skincareCRM_v1';
const SKIN_TYPES = ['乾性','油性','混合','敏感','痘痘肌','中性','暗沉','泛紅'];
const PAY_METHODS = {
  cash:    {label:'現金',      icon:'💵'},
  transfer:{label:'轉帳',      icon:'🏦'},
  linepay: {label:'LINE Pay',  icon:'💚'},
  package: {label:'扣包套 1 次', icon:'🎫'},
  balance: {label:'扣儲值金',   icon:'💳'},
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaultData(){
  return {
    version:1,
    shopName:'奶茶光 皮膚管理',
    footer:'感謝您的光臨，期待下次見面 🤍',
    items:[
      {id:uid(),cat:'service',name:'水飛梭保濕',price:1800},
      {id:uid(),cat:'service',name:'手工清粉刺',price:1200},
      {id:uid(),cat:'service',name:'酸類煥膚',price:2000},
      {id:uid(),cat:'product',name:'PDRN 精華液',price:1500},
      {id:uid(),cat:'product',name:'修復霜',price:800},
    ],
    customers:[],
    orders:[],
    lastBackup:null,
  };
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if(d && Array.isArray(d.customers)) return Object.assign(defaultData(), d);
  }catch(e){}
  return defaultData();
}
let db = load();
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch(e){ alert('儲存失敗：瀏覽器空間不足或被封鎖，請立即匯出備份！'); }
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(Number(n)||0).toLocaleString('en-US');
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtDT = iso => { const d=new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = s => s ? s.replace(/-/g,'/') : '';
const getCust = id => db.customers.find(c => c.id === id);
const initial = name => (name||'?').trim().charAt(0);

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function openModal(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#modal').classList.add('show'); $('#sheet').scrollTop=0; }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });
$('#receiptModal').addEventListener('click', e => { if(e.target.id==='receiptModal') closeReceipt(); });

/* ================= 分頁切換 ================= */
let currentPage = 'customers';
function go(page){
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-'+page));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  $('#fab').style.display = page === 'customers' ? '' : 'none';
  if(page==='customers') renderCustomers();
  if(page==='checkout') renderCheckout();
  if(page==='orders') renderOrders();
  if(page==='settings') renderSettings();
  window.scrollTo({top:0});
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));

/* ================= 顧客管理 ================= */
function matchCust(c, q){
  q = q.trim().toLowerCase();
  if(!q) return true;
  const digits = q.replace(/\D/g,'');
  return c.name.toLowerCase().includes(q) || (!!digits && (c.phone||'').replace(/\D/g,'').includes(digits));
}
function lastVisit(c){
  const r = (c.records||[]).map(x=>x.date).sort().pop();
  return r ? fmtD(r) : '尚無紀錄';
}
function renderCustomers(){
  const q = $('#custSearch').value;
  const list = db.customers.filter(c => matchCust(c,q)).sort((a,b)=> (b.updatedAt||0)-(a.updatedAt||0));
  $('#custCount').textContent = `顧客 ${db.customers.length} 位` + (q ? `・符合 ${list.length} 位` : '');
  if(!list.length){
    $('#custList').innerHTML = `<div class="empty">${db.customers.length ? '找不到符合的顧客' : '還沒有顧客資料<br>點右下角「＋」新增第一位顧客 🌿'}</div>`;
    return;
  }
  $('#custList').innerHTML = list.map(c => `
    <div class="card cust" onclick="openDetail('${c.id}')">
      <div class="avatar">${esc(initial(c.name))}</div>
      <div class="grow">
        <div class="name">${esc(c.name)}</div>
        <div class="muted">${esc(c.phone||'未填電話')}・最近 ${lastVisit(c)}</div>
        ${c.skin?.length ? `<div class="tags" style="margin-top:6px">${c.skin.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>`:''}
      </div>
      <div class="meta">包套 <b>${c.credits||0}</b> 次<br>儲值 <b>${money(c.balance)}</b></div>
    </div>`).join('');
}
$('#custSearch').addEventListener('input', renderCustomers);

function openCustomerForm(id){

  openModal(`
    <div class="sheet-head"><h2>${id?'編輯顧客':'新增顧客'}</h2><button class="close" onclick="closeModal()">✕</button></div>
    <div class="card">
      <label class="field"><span>姓名 *</span><input type="text" id="fName" value="${esc(c.name)}" placeholder="例：王小美"></label>
      <label class="field"><span>電話</span><input type="tel" id="fPhone" value="${esc(c.phone)}" placeholder="0912-345-678" inputmode="tel"></label>
      <div class="field"><span class="muted" style="display:block;margin-bottom:6px">膚質標籤（可複選）</span>
        <div class="chip-select">${SKIN_TYPES.map(s=>`<label><input type="checkbox" name="fSkin" value="${s}" ${c.skin?.includes(s)?'checked':''}><span>${s}</span></label>`).join('')}</div>
      </div>
      <div class="grid2" style="margin-top:12px">
        <label class="field"><span>包套剩餘次數</span><input type="number" id="fCredits" value="${c.credits||0}" min="0" inputmode="numeric"></label>
        <label class="field"><span>儲值金餘額</span><input type="number" id="fBalance" value="${c.balance||0}" min="0" inputmode="numeric"></label>
      </div>
      <label class="field" style="margin:0"><span>備註（過敏史、偏好等）</span><textarea id="fNote" placeholder="選填">${esc(c.note)}</textarea></label>

    <button class="btn block" onclick="saveCustomer('${id||''}')">${id?'儲存變更':'新增顧客'}</button>

function saveCustomer(id){
  const name = $('#fName').value.trim();
  if(!name){ toast('請輸入顧客姓名'); return; }
  const data = {
    name,
    phone: $('#fPhone').value.trim(),
    skin: [...document.querySelectorAll('input[name=fSkin]:checked')].map(i=>i.value),
    credits: Math.max(0, parseInt($('#fCredits').value)||0),
    balance: Math.max(0, parseFloat($('#fBalance').value)||0),
    note: $('#fNote').value.trim(),
    updatedAt: Date.now(),
  };
  if(id){ Object.assign(getCust(id), data); }
  else { db.customers.push({id:uid(), records:[], createdAt:Date.now(), ...data}); }
  save(); toast(id?'已更新顧客資料':'已新增顧客');
  renderCustomers();
  if(id) openDetail(id); else closeModal();
}
function deleteCustomer(id){
  const c = getCust(id);
  if(!confirm(`確定刪除「${c.name}」？\n此顧客的施作紀錄將一併刪除（消費紀錄保留）。`)) return;
  db.customers = db.customers.filter(x=>x.id!==id);
  save(); closeModal(); renderCustomers(); toast('已刪除顧客');
}

        <div class="tl-item">
          <button class="x" onclick="deleteRecord('${id}','${r.id}')">刪除</button>
          <div class="d">${fmtD(r.date)}</div>

        </div>`).join('')}</div>` : '<div class="empty" style="padding:16px">尚無施作紀錄</div>'}
    </div>

    <div class="section-title">最近消費 <span>${orders.length ? '最近 10 筆' : ''}</span></div>
    <div class="card">
      ${orders.length ? orders.map(o=>`
        <div class="list-item" style="cursor:pointer" onclick="showReceipt('${o.id}')">
          <div class="grow"><div style="font-size:14px">${esc(o.lines.map(l=>l.name).join('、'))}</div><div class="muted">${fmtDT(o.date)}・${esc(methodText(o))}</div></div>
          <div style="font-weight:600;color:var(--milk-dark)">${money(o.total)}</div>

function addRecord(id){
  const note = $('#rNote').value.trim();
  const date = $('#rDate').value || todayStr();
  if(!note){ toast('請輸入施作內容'); return; }
  const c = getCust(id);
  c.records = c.records || [];
  c.records.push({id:uid(), date, note, createdAt:Date.now()});
  c.updatedAt = Date.now();
  save(); toast('已新增施作紀錄'); openDetail(id); renderCustomers();
}
function deleteRecord(cid, rid){
  if(!confirm('確定刪除這筆施作紀錄？')) return;
  const c = getCust(cid);
  c.records = c.records.filter(r=>r.id!==rid);
  save(); openDetail(cid);
}

/* 儲值 / 加購包套 */
function openTopup(id){
  const c = getCust(id);
  openModal(`
    <div class="sheet-head"><h2>儲值 / 加購包套</h2><button class="close" onclick="openDetail('${id}')">✕</button></div>
    <div class="card">
      <div class="muted">${esc(c.name)}・目前包套 ${c.credits||0} 次・儲值 ${money(c.balance)}</div>
      <div class="grid2" style="margin-top:12px">
        <label class="field"><span>增加包套次數</span><input type="number" id="tCredits" value="0" min="0" inputmode="numeric"></label>
        <label class="field"><span>增加儲值金</span><input type="number" id="tBalance" value="0" min="0" inputmode="numeric"></label>
      </div>
      <label class="field"><span>實收金額（記入營收，可為 0）</span><input type="number" id="tPaid" value="0" min="0" inputmode="numeric"></label>
      <label class="field" style="margin:0"><span>付款方式</span>
        <select id="tMethod"><option value="cash">現金</option><option value="transfer">轉帳</option><option value="linepay">LINE Pay</option></select>
      </label>
    </div>
    <button class="btn block" onclick="saveTopup('${id}')">確認加值</button>
  `);
}
function saveTopup(id){
  const c = getCust(id);
  const addC = Math.max(0, parseInt($('#tCredits').value)||0);
  const addB = Math.max(0, parseFloat($('#tBalance').value)||0);
  const paid = Math.max(0, parseFloat($('#tPaid').value)||0);
  if(!addC && !addB){ toast('請輸入要增加的次數或金額'); return; }
  c.credits = (c.credits||0) + addC;
  c.balance = (c.balance||0) + addB;
  c.updatedAt = Date.now();
  const lines = [];
  if(addC) lines.push({name:`加購包套 ${addC} 次`, price:0, qty:1, cat:'topup'});
  if(addB) lines.push({name:`儲值金 ${money(addB)}`, price:0, qty:1, cat:'topup'});
  const order = {
    id:uid(), type:'topup', date:new Date().toISOString(), customerId:id, customerName:c.name,
    lines, total:paid, method:$('#tMethod').value, paid,
    creditsUsed:-addC, balanceUsed:-addB, creditsAfter:c.credits, balanceAfter:c.balance,
  };
  db.orders.unshift(order);
  save(); renderCustomers(); closeModal(); showReceipt(order.id);
}

/* ================= 結帳 ================= */
const co = { customerId:'', cart:{}, method:'cash', subMethod:'cash', addRecord:true };

function checkoutFor(id){ closeModal(); co.customerId = id; go('checkout'); }

function cartLines(){
  return Object.entries(co.cart).filter(([,q])=>q>0).map(([iid,qty])=>{
    const it = db.items.find(i=>i.id===iid);
    return it ? {name:it.name, price:it.price, qty, cat:it.cat} : null;
  }).filter(Boolean);
}
function calc(){
  const lines = cartLines();
  const service = lines.filter(l=>l.cat==='service').reduce((s,l)=>s+l.price*l.qty,0);
  const product = lines.filter(l=>l.cat==='product').reduce((s,l)=>s+l.price*l.qty,0);
  return {lines, service, product, total:service+product};
}

function renderCheckout(){
  // 顧客
  const c = getCust(co.customerId);
  if(!c) co.customerId = '';
  $('#coCustomer').innerHTML = c ? `
    <div class="row" style="margin-top:12px;background:var(--milk-pale);border-radius:14px;padding:12px">
      <div class="avatar" style="width:40px;height:40px;font-size:16px">${esc(initial(c.name))}</div>
      <div class="grow"><b>${esc(c.name)}</b><div class="muted">包套 ${c.credits||0} 次・儲值 ${money(c.balance)}</div></div>
      <button class="btn sm light" onclick="co.customerId='';renderCheckout()">更換</button>
    </div>` : `<div class="muted" style="margin-top:10px">未選擇顧客將以「散客」結帳（僅可使用現金 / 轉帳 / LINE Pay）</div>`;
  $('#coSearch').style.display = c ? 'none' : '';

  // 品項
  const itemHtml = cat => {
    const arr = db.items.filter(i=>i.cat===cat);
    if(!arr.length) return `<div class="muted">尚無品項，可至「設定」新增</div>`;
    return arr.map(i=>{
      const q = co.cart[i.id]||0;
      return `<div class="item ${q?'on':''}" onclick="toggleItem('${i.id}')">
        <div class="n">${esc(i.name)}</div><div class="p">${money(i.price)}</div>
        <div class="qty" onclick="event.stopPropagation()">
          <button onclick="changeQty('${i.id}',-1)">−</button><b>${q}</b><button onclick="changeQty('${i.id}',1)">＋</button>
        </div>
      </div>`;
    }).join('');
  };
  $('#coServices').innerHTML = itemHtml('service');
  $('#coProducts').innerHTML = itemHtml('product');

  // 付款方式
  if(!c && (co.method==='package'||co.method==='balance')) co.method = 'cash';
  $('#coPay').innerHTML = Object.entries(PAY_METHODS).map(([k,m])=>`
    <label><input type="radio" name="coPay" value="${k}" ${co.method===k?'checked':''} ${!c&&(k==='package'||k==='balance')?'disabled':''} onchange="co.method=this.value;renderCheckout()">
    <span><i>${m.icon}</i>${m.label}</span></label>`).join('');

  const {lines, service, product, total} = calc();
  let msg = '', ok = lines.length > 0, sub = '';
  let paid = total, creditsUse = 0, balanceUse = 0;

  if(co.method==='package'){
    creditsUse = 1; paid = product;
    if(!service){ ok=false; msg = `<div class="warn">扣抵包套需至少選擇一項「服務項目」</div>`; }
    else if((c.credits||0) < 1){ ok=false; msg = `<div class="warn">此顧客包套次數不足（剩 ${c.credits||0} 次）</div>`; }
    else msg = `<div class="info">服務項目以包套 1 次核銷${product?`；保養品 ${money(product)} 請另選付款方式`:''}</div>`;
    if(product){
      sub = `<label class="field" style="margin:12px 0 0"><span>保養品付款方式</span>
        <select onchange="co.subMethod=this.value;renderCheckout()">
          ${['cash','transfer','linepay','balance'].map(k=>`<option value="${k}" ${co.subMethod===k?'selected':''}>${PAY_METHODS[k].label}</option>`).join('')}
        </select></label>`;
      if(co.subMethod==='balance'){
        balanceUse = product; paid = 0;
        if((c.balance||0) < product){ ok=false; msg += `<div class="warn">儲值金不足（餘額 ${money(c.balance)}，需 ${money(product)}）</div>`; }
      }
    }
  } else if(co.method==='balance'){
    balanceUse = total; paid = 0;
    if((c.balance||0) < total){ ok=false; msg = `<div class="warn">儲值金不足（餘額 ${money(c.balance)}，需 ${money(total)}）</div>`; }
  }
  $('#coSubPay').innerHTML = sub;
  $('#coMsg').innerHTML = lines.length ? msg : '';

  $('#coSummary').innerHTML = `
    <div class="section-title" style="margin-top:0">結帳明細</div>
    ${lines.length ? lines.map(l=>`<div class="line"><span>${esc(l.name)} × ${l.qty}</span><span>${money(l.price*l.qty)}</span></div>`).join('')
      : '<div class="muted">尚未選擇任何品項</div>'}
    <div class="line" style="margin-top:6px;color:var(--sub)"><span>小計</span><span>${money(total)}</span></div>
    ${creditsUse?`<div class="line" style="color:var(--milk-dark)"><span>🎫 扣抵包套</span><span>-1 次（折抵 ${money(service)}）</span></div>`:''}
    ${balanceUse?`<div class="line" style="color:var(--milk-dark)"><span>💳 扣抵儲值金</span><span>-${money(balanceUse)}</span></div>`:''}
    <div class="line total"><span>本次應收</span><span>${money(paid)}</span></div>
    ${c ? `<label class="check"><input type="checkbox" ${co.addRecord?'checked':''} onchange="co.addRecord=this.checked"> 同步新增本日施作紀錄（服務項目）</label>` : ''}
  `;
  $('#coConfirm').disabled = !ok;
  co._calc = {lines, service, product, total, paid, creditsUse, balanceUse};
}
function toggleItem(id){ co.cart[id] = co.cart[id] ? 0 : 1; renderCheckout(); }
function changeQty(id, d){ co.cart[id] = Math.max(0,(co.cart[id]||0)+d); renderCheckout(); }

/* 結帳頁顧客搜尋 */
const coSearch = $('#coSearch'), coList = $('#coPickerList');
function renderPicker(){
  const q = coSearch.value;
  const arr = db.customers.filter(c=>matchCust(c,q)).slice(0,20);
  coList.innerHTML = arr.length ? arr.map(c=>`<div data-id="${c.id}">
      <b>${esc(c.name)}</b> <span class="muted">${esc(c.phone||'')}</span>
      <div class="muted">包套 ${c.credits||0} 次・儲值 ${money(c.balance)}</div></div>`).join('')
    : `<div class="muted">${db.customers.length?'找不到符合的顧客':'尚無顧客，請先至「顧客」新增'}</div>`;
  coList.classList.add('show');
}
coSearch.addEventListener('focus', renderPicker);
coSearch.addEventListener('input', renderPicker);
coSearch.addEventListener('blur', ()=>setTimeout(()=>coList.classList.remove('show'),150));
coList.addEventListener('mousedown', e=>e.preventDefault()); // 保持輸入框焦點，避免 blur 先關閉清單
coList.addEventListener('click', e=>{ const d=e.target.closest('div[data-id]'); if(d) pickCustomer(d.dataset.id); });
function pickCustomer(id){ co.customerId=id; coSearch.value=''; coList.classList.remove('show'); renderCheckout(); }

function confirmCheckout(){
  renderCheckout();
  const k = co._calc; if(!k.lines.length) return;
  const c = getCust(co.customerId);
  if(c){
    c.credits = (c.credits||0) - k.creditsUse;
    c.balance = (c.balance||0) - k.balanceUse;
    c.updatedAt = Date.now();
    if(co.addRecord && k.service){
      const names = k.lines.filter(l=>l.cat==='service').map(l=>l.qty>1?`${l.name}×${l.qty}`:l.name).join('、');
      c.records = c.records || [];
      c.records.push({id:uid(), date:todayStr(), note:`【結帳自動紀錄】${names}`, createdAt:Date.now()});
    }
  }
  const order = {
    id:uid(), type:'sale', date:new Date().toISOString(),
    customerId:c?c.id:'', customerName:c?c.name:'散客',
    lines:k.lines, total:k.total, method:co.method,
    subMethod: co.method==='package' && k.product ? co.subMethod : null,
    paid:k.paid, creditsUsed:k.creditsUse, balanceUsed:k.balanceUse,
    creditsAfter:c?c.credits:null, balanceAfter:c?c.balance:null,
  };
  db.orders.unshift(order);
  save();
  // 重置結帳狀態
  co.cart = {}; co.method='cash'; co.subMethod='cash'; co.customerId='';
  renderCheckout();
  showReceipt(order.id);
}

/* ================= LINE 文字收據 ================= */
function methodText(o){
  if(o.type==='topup') return '加值・' + PAY_METHODS[o.method].label;
  let t = PAY_METHODS[o.method]?.label || o.method;
  if(o.method==='package') t = '扣抵包套 1 次';
  if(o.subMethod) t += `＋保養品 ${PAY_METHODS[o.subMethod].label}`;
  return t;
}
function buildReceipt(o){
  const L = '━━━━━━━━━━━━━━';
  const out = [];
  out.push(`✨ ${db.shopName} ✨`);
  out.push(o.type==='topup' ? '儲值 / 包套收據' : '消費收據');
  out.push(L);
  out.push(`顧客：${o.customerName}`);
  out.push(`日期：${fmtDT(o.date)}`);
  out.push(L);
  out.push('【項目明細】');
  o.lines.forEach(l=>{
    if(o.type==='topup') out.push(`・${l.name}`);
    else out.push(`・${l.name}${l.qty>1?' ×'+l.qty:''}　${money(l.price*l.qty)}`);
  });
  out.push(L);
  if(o.type==='topup'){
    out.push(`付款方式：${PAY_METHODS[o.method].label}`);
    out.push(`實收金額：${money(o.paid)}`);
  } else {
    out.push(`消費小計：${money(o.total)}`);
    if(o.creditsUsed) out.push(`🎫 扣抵包套：${o.creditsUsed} 次`);
    if(o.balanceUsed) out.push(`💳 扣抵儲值金：${money(o.balanceUsed)}`);
    if(o.paid){
      const pm = o.method==='package' ? o.subMethod : o.method;
      out.push(`💰 本次付款：${money(o.paid)}（${PAY_METHODS[pm].label}）`);
    } else {
      out.push(`💰 本次付款：$0`);
    }
  }
  if(o.customerId){
    out.push(L);
    out.push(`剩餘包套次數：${o.creditsAfter} 次`);
    out.push(`儲值金餘額：${money(o.balanceAfter)}`);
  }
  out.push(L);
  if(db.footer) out.push(db.footer);
  return out.join('\n');
}
function showReceipt(orderId){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  closeModal();
  $('#receiptText').textContent = buildReceipt(o);
  const b = $('#copyBtn'); b.classList.remove('copied'); b.textContent = '📋 一鍵複製收據文字';
  $('#receiptModal').classList.add('show');
}
function closeReceipt(){ $('#receiptModal').classList.remove('show'); if(currentPage==='orders') renderOrders(); }
async function copyReceipt(){
  const text = $('#receiptText').textContent;
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }
  catch(e){
    // 備援：舊瀏覽器 / 非 https 環境（例如直接開本機檔案）
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  const b = $('#copyBtn');
  if(ok){ b.classList.add('copied'); b.textContent = '✓ 已複製！'; toast('已複製！可直接貼到 LINE'); }
  else { toast('複製失敗，請長按收據文字手動複製'); }
  setTimeout(()=>{ b.classList.remove('copied'); b.textContent='📋 一鍵複製收據文字'; }, 2500);
}

/* ================= 消費紀錄 ================= */
function renderOrders(){
  const t = todayStr();
  const todays = db.orders.filter(o=>{ const d=new Date(o.date); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`===t; });
  $('#todayRevenue').textContent = money(todays.reduce((s,o)=>s+(o.paid||0),0));
  $('#todayCount').textContent = todays.length;
  if(!db.orders.length){ $('#orderList').innerHTML = '<div class="empty">尚無消費紀錄</div>'; return; }
  $('#orderList').innerHTML = db.orders.slice(0,200).map(o=>`
    <div class="card order row" onclick="showReceipt('${o.id}')">
      <div class="grow">
        <div><b>${esc(o.customerName)}</b><span class="badge">${esc(methodText(o))}</span></div>
        <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(o.lines.map(l=>l.name).join('、'))}</div>
        <div class="muted">${fmtDT(o.date)}</div>
      </div>
      <div style="text-align:right">
        <div class="amt">${money(o.paid)}</div>
        <div class="muted">${o.type==='topup'?'加值':'小計 '+money(o.total)}</div>
      </div>
    </div>`).join('') + (db.orders.length>200?'<div class="empty">僅顯示最近 200 筆，完整資料請匯出備份</div>':'');
}

/* ================= 設定 ================= */
let itemCat = 'service';
function renderSettings(){
  $('#setShopName').value = db.shopName;
  $('#setFooter').value = db.footer || '';
  document.querySelectorAll('#itemSeg button').forEach(b=>b.classList.toggle('active', b.dataset.cat===itemCat));
  const arr = db.items.filter(i=>i.cat===itemCat);
  $('#itemList').innerHTML = arr.length ? arr.map(i=>`
    <div class="list-item">
      <div class="grow">${esc(i.name)}</div>
      <input type="number" value="${i.price}" style="width:96px;padding:8px 10px;margin-right:8px" inputmode="numeric" onchange="updatePrice('${i.id}',this.value)">
      <button class="btn sm danger" onclick="deleteItem('${i.id}')">刪除</button>
    </div>`).join('') : '<div class="muted">尚無品項</div>';
  $('#lastBackup').textContent = db.lastBackup ? `上次匯出備份：${fmtDT(db.lastBackup)}` : '尚未匯出過備份';
}
document.querySelectorAll('#itemSeg button').forEach(b=>b.addEventListener('click',()=>{ itemCat=b.dataset.cat; renderSettings(); }));
function saveShop(){
  db.shopName = $('#setShopName').value.trim() || '皮膚管理';
  db.footer = $('#setFooter').value.trim();
  save(); updateTitle(); toast('已儲存店家資訊');
}
function addItem(){
  const name = $('#newItemName').value.trim();
  const price = parseFloat($('#newItemPrice').value);
  if(!name || !(price>=0)){ toast('請輸入品項名稱與價格'); return; }
  db.items.push({id:uid(), cat:itemCat, name, price});
  $('#newItemName').value=''; $('#newItemPrice').value='';
  save(); renderSettings(); toast('已新增品項');
}
function updatePrice(id, v){
  const it = db.items.find(i=>i.id===id); it.price = Math.max(0, parseFloat(v)||0);
  save(); toast('已更新價格');
}
function deleteItem(id){
  if(!confirm('確定刪除此品項？（不影響既有消費紀錄）')) return;
  db.items = db.items.filter(i=>i.id!==id); delete co.cart[id];
  save(); renderSettings();
}

/* ================= 備份 / 復原 ================= */
function exportJSON(){
  db.lastBackup = new Date().toISOString(); save();
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = `skincare-crm-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  renderSettings(); toast('備份檔已下載');
}
$('#importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d || !Array.isArray(d.customers) || !Array.isArray(d.items)) throw new Error('格式不符');
      if(!confirm(`備份檔包含 ${d.customers.length} 位顧客、${(d.orders||[]).length} 筆消費紀錄。\n匯入將「覆蓋」目前所有資料，確定繼續？`)) return;
      db = Object.assign(defaultData(), d);
      save(); updateTitle(); co.cart={}; co.customerId='';
      renderSettings(); toast('資料已復原 ✓');
    }catch(err){ alert('匯入失敗：檔案不是有效的備份 JSON。\n' + err.message); }
    finally{ e.target.value=''; }
  };
  reader.readAsText(f);
});
function resetAll(){
  if(!confirm('確定清除「所有」顧客、紀錄與設定？此動作無法復原！\n建議先匯出備份。')) return;
  if(prompt('請輸入「刪除」以確認') !== '刪除') return;
  db = defaultData(); save(); updateTitle(); co.cart={}; co.customerId='';
  renderSettings(); toast('已清除所有資料');
}

/* ================= 初始化 ================= */
function updateTitle(){ $('#shopTitle').textContent = db.shopName; document.title = db.shopName + '・CRM'; }
updateTitle();
renderCustomers();
</script>
